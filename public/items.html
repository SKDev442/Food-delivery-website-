<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesiBites & Western Eats | Fast Food Delivery</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Claymorphic Utilities via Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clayBg: '#F3F0E6',
            saffron: '#E65100',
            turmeric: '#FFB300',
            cardamom: '#2E7D32',
          },
          boxShadow: {
            'clay-card': '12px 12px 24px #d0cdb7, -12px -12px 24px #ffffff, inset 3px 3px 6px rgba(255, 255, 255, 0.7), inset -3px -3px 6px rgba(0, 0, 0, 0.05)',
            'clay-btn': '6px 6px 12px #d0cdb7, -6px -6px 12px #ffffff, inset 2px 2px 4px rgba(255, 255, 255, 0.6)',
            'clay-btn-active': 'inset 4px 4px 8px #b8b5a0, inset -4px -4px 8px #ffffff',
            'clay-badge': '4px 4px 8px #d0cdb7, -4px -4px 8px #ffffff',
          },
          keyframes: {
            pop: {
              '0%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.12)' },
              '100%': { transform: 'scale(1)' },
            }
          },
          animation: {
            pop: 'pop 0.35s ease-in-out',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-clayBg text-gray-800 min-h-screen font-sans">

  <!-- ================= NAVBAR ================= -->
 
<!-- ================= RESPONSIVE NAVBAR ================= -->
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center justify-between gap-3 sm:gap-4">
    
    <!-- Brand Logo -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <div class="w-10 h-10 sm:w-12 sm:h-12 bg-orange-600 rounded-2xl shadow-md flex items-center justify-center text-white text-xl sm:text-2xl font-black flex-shrink-0">
        🍕
      </div>
      <div>
        <span class="text-lg sm:text-2xl font-black text-orange-600 tracking-tight block leading-none">DesiBites & Eats</span>
        <span class="text-[9px] sm:text-[10px] text-gray-500 font-bold uppercase tracking-widest block mt-0.5">30-Min Express Delivery</span>
      </div>
    </div>

    <!-- Navigation, Greeting & Action Buttons -->
    <div class="flex items-center gap-4 sm:gap-4">

      <!-- Address Button -->
      <a href="address.html" class="flex items-center gap-1.5 px-5 py-1.5 sm:py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs sm:text-sm font-semibold transition-all border border-gray-200">
        <span class="text-xs sm:text-sm">📍</span>
        <span id="navAddressText" class="truncate max-w-[90px] sm:max-w-none">Set Address</span>
      </a>
      
      <!-- Welcome Message (Hidden on very small screens) -->
      <div class="hidden md:block text-right">
        <span class="text-xs text-gray-500 block font-medium leading-none">Hello there,</span>
        <span id="navUsername" class="text-sm font-bold text-gray-800 leading-tight"></span>
      </div>

      <!-- Profile Icon Button -->
      <a href="profile.html" title="View Profile" 
         class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gray-100 hover:bg-orange-50 border border-gray-200 hover:border-orange-200 flex items-center justify-center text-gray-700 hover:text-orange-600 transition-all shadow-sm active:scale-95 flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </a>

      <!-- Cart Button -->
      <button onclick="toggleCartModal()" class="relative px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-2xl bg-gradient-to-r from-orange-600 to-amber-600 text-white font-bold shadow-lg shadow-orange-500/20 hover:from-orange-700 hover:to-amber-700 transition-all flex items-center gap-1.5 sm:gap-2 active:scale-95 text-xs sm:text-sm flex-shrink-0">
        <span>🛒 <span class="hidden xs:inline">Your Order</span></span>
        <span id="cart-badge-count" class="bg-amber-300 text-gray-900 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
      </button>

    </div>

  </div>
</header>

  <!-- ================= MAIN CATALOG ================= -->
  <section id="catalog" class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Title & Search Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-3xl font-black text-gray-900">Explore Dishes & Snacks</h2>
        <p class="text-sm text-gray-500 mt-1">Order fresh food delivered hot to your doorstep</p>
      </div>

      <!-- Live Search Bar -->
      <div class="relative w-full md:w-80">
        <input 
          type="text" 
          id="search-input" 
          oninput="handleSearch()"
          placeholder="Search dishes, snacks..." 
          class="w-full px-5 py-3 rounded-2xl bg-clayBg text-gray-800 font-medium placeholder-gray-400 shadow-clay-btn focus:outline-none focus:ring-2 focus:ring-saffron transition-all"
        />
        <span class="absolute right-4 top-3 text-lg">🔍</span>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="flex flex-wrap gap-3 mb-8" id="category-filters">
      <button id="cat-all" onclick="filterCategory('all')" class="px-4 py-2 rounded-xl bg-saffron text-white font-bold text-sm shadow-clay-btn transition-all">
        All Dishes 
      </button>
      <button id="cat-western" onclick="filterCategory('western')" class="px-4 py-2 rounded-xl bg-clayBg text-gray-700 font-bold text-sm shadow-clay-btn hover:text-saffron transition-all">
        Western Food
      </button>
      <button id="cat-snacks" onclick="filterCategory('snacks')" class="px-4 py-2 rounded-xl bg-clayBg text-gray-700 font-bold text-sm shadow-clay-btn hover:text-saffron transition-all">
        Desi Snacks 
      </button>
      <button id="cat-sweets" onclick="filterCategory('sweets')" class="px-4 py-2 rounded-xl bg-clayBg text-gray-700 font-bold text-sm shadow-clay-btn hover:text-saffron transition-all">
        Indian Sweets 
      </button>
      <button id="cat-beverages" onclick="filterCategory('beverages')" class="px-4 py-2 rounded-xl bg-clayBg text-gray-700 font-bold text-sm shadow-clay-btn hover:text-saffron transition-all">
        Drinks & Shakes 
      </button>
    </div>

    <!-- Dynamic Product Cards Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>

    <!-- Load More Section -->
    <div class="flex flex-col items-center justify-center mt-12 gap-3" id="load-more-container">
      <p class="text-sm font-semibold text-gray-500" id="item-progress-text">Showing 8 of 80 items</p>
      <button 
        id="load-more-btn"
        onclick="loadMoreItems()" 
        class="px-8 py-3.5 rounded-2xl bg-clayBg text-saffron font-bold text-base shadow-clay-btn active:shadow-clay-btn-active hover:bg-saffron hover:text-white transition-all"
      >
        Load More Dishes 🍔
      </button>
    </div>

  </section>

  <!-- ================= SLIDE-OVER CART MODAL ================= -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden bg-black/30 backdrop-blur-sm flex justify-end">
    <div class="w-full max-w-md bg-clayBg h-full p-6 shadow-2xl flex flex-col justify-between overflow-y-auto">
      
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-gray-300/40 mb-6">
          <h3 class="text-2xl font-black text-gray-900">Your Order 🛍️</h3>
          <button onclick="toggleCartModal()" class="w-10 h-10 rounded-2xl bg-clayBg shadow-clay-btn text-lg font-bold">✕</button>
        </div>

        <div id="cart-items-container" class="space-y-4">
          <p class="text-gray-500 text-center py-8">Your cart is empty. Add some delicious dishes!</p>
        </div>
      </div>

      <div class="pt-6 border-t border-gray-300/40">
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-600 font-semibold">Total Payable</span>
          <span class="text-2xl font-black text-saffron">₹<span id="cart-total-price">0</span></span>
        </div>
        
        <a href='payment.html'>
        <button  

          class="w-full py-4 rounded-2xl bg-saffron text-white font-bold text-lg shadow-clay-btn active:shadow-clay-btn-active transition-all"
        >
          Place Delivery Order 🛵
        </button>
        </a>
      </div>

    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script type="module">
    import productsData from './products.js';
    
    // State Variables
    let currentCategory = 'all';
    let searchQuery = '';
    let visibleCount = 8;
    const BATCH_SIZE = 8;

    const usernameCont= document.getElementById('navUsername');
    const username= localStorage.getItem('username') ? localStorage.getItem('username') : '';

    usernameCont.innerText= `Welcome ${username}`;
     
    
    // Initialize Cart from localStorage for global persistence
   let cart = [];
try {
  const storedCart = localStorage.getItem('desibites_cart');
  cart = storedCart ? JSON.parse(storedCart) : [];
} catch (e) {
  cart = [];
}

    // Filter Logic
    function getFilteredProducts() {
      return productsData.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            p.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });
    }


    //address

   
   // document.getElementById('load-more-btn').click();

    // Render Catalog Items Batch
    function renderCatalog() {
      const filtered = getFilteredProducts();
      const grid = document.getElementById('product-grid');
      const loadMoreContainer = document.getElementById('load-more-container');
      const progressText = document.getElementById('item-progress-text');

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center">
            <span class="text-5xl inline-block mb-3">🔍</span>
            <h4 class="text-xl font-bold text-gray-800">No dishes found</h4>
            <p class="text-gray-500 text-sm mt-1">Try tweaking your search query or switching categories.</p>
          </div>
        `;
        loadMoreContainer.classList.add('hidden');
        return;
      }

      const itemsToDisplay = filtered.slice(0, visibleCount);

      grid.innerHTML = itemsToDisplay.map(p => `
        <div class="p-6 rounded-3xl bg-clayBg shadow-clay-card flex flex-col justify-between transition-transform hover:-translate-y-1">
          <div>
            <div class="w-full h-40 rounded-2xl bg-clayBg shadow-clay-btn overflow-hidden p-2 mb-4 relative">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover rounded-xl" />
              
            </div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-saffron uppercase tracking-wider">${p.category}</span>
              
            </div>
            <h3 class="font-black text-xl text-gray-900 mb-1 leading-snug">${p.name}</h3>
            <p class="text-sm text-gray-500 mb-4 leading-snug">${p.description}</p>
          </div>
          
          <div class="flex items-center justify-between mt-2 pt-4 border-t border-gray-200/50">
            <span class="text-xl font-black text-saffron">₹${p.price}</span>
            <button 
              id="add-btn-${p.id}"
              onclick="addToCart(${p.id}, this)"
              class="px-4 py-2 rounded-xl bg-clayBg text-saffron font-bold shadow-clay-btn active:shadow-clay-btn-active hover:bg-saffron hover:text-white transition-all text-sm"
            >
              + Add
            </button>
          </div>
        </div>
      `).join('');

      // Update Pagination UI
      if (itemsToDisplay.length >= filtered.length) {
        loadMoreContainer.classList.add('hidden');
      } else {
        loadMoreContainer.classList.remove('hidden');
        progressText.innerText = `Showing ${itemsToDisplay.length} of ${filtered.length} items`;
      }
    }

    // Handlers
    function loadMoreItems() {
      visibleCount += BATCH_SIZE;
      renderCatalog();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      visibleCount = BATCH_SIZE;

      // Update Active Category Pill Styles
      ['all', 'western', 'snacks', 'sweets', 'beverages'].forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (btn) {
          if (c === cat) {
            btn.className = 'px-4 py-2 rounded-xl bg-saffron text-white font-bold text-sm shadow-clay-btn transition-all';
          } else {
            btn.className = 'px-4 py-2 rounded-xl bg-clayBg text-gray-700 font-bold text-sm shadow-clay-btn hover:text-saffron transition-all';
          }
        }
      });

      renderCatalog();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value;
      visibleCount = BATCH_SIZE;
      renderCatalog();
    }

    function addToCart(productId, buttonEl) {
      let item = productsData.find(p => p.id === productId);
      const existing = cart.find(c => c.id === productId);

      if (existing) {
        existing.qty += 1;
      } else { 
       
        cart.push({ ...item, qty: 1 }); 
      }

      // Save to localStorage so cart persists across page navigations
      localStorage.setItem('desibites_cart', JSON.stringify(cart));
      updateCartUI();

      if (buttonEl) {
        const originalText = buttonEl.innerHTML;
        const originalClasses = buttonEl.className;
        
        buttonEl.innerHTML = '✓ Added';
        buttonEl.className = `${originalClasses} !bg-cardamom !text-white animate-pop`;
        buttonEl.disabled = true;

        setTimeout(() => {
          buttonEl.innerHTML = originalText;
          buttonEl.className = originalClasses;
          buttonEl.disabled = false;
        }, 1000);
      }
    }
    
    let tp;
    let totalPrice;

    function updateCartUI() {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total-price');
      const badgeCount = document.getElementById('cart-badge-count');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
       totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
     
      tp=totalPrice;
      badgeCount.innerText = totalItems;
      totalEl.innerText = totalPrice;

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8">Your cart is empty. Add some delicious dishes!</p>';
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div class="p-4 rounded-2xl bg-clayBg shadow-clay-btn flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="${item.image}" alt="${item.name}" class="w-10 h-10 rounded-xl object-cover shadow-inner flex-shrink-0" />
            <div>
              <h4 class="font-bold text-gray-900 text-sm">${item.name}</h4>
              <p class="text-xs text-gray-500">₹${item.price} × ${item.qty}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-black text-saffron text-sm">₹${item.price * item.qty}</span>
            <button onclick="removeFromCart(${index})" class="text-red-500 font-bold ml-2">✕</button>
          </div>
        </div>
      `).join('');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('desibites_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function toggleCartModal() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }


    //place order was here hehehehehe

     let cartData= localStorage.getItem('desibites_cart');

    // Expose functions globally to support HTML inline event handlers inside modules
    window.loadMoreItems = loadMoreItems;
    window.filterCategory = filterCategory;
    window.handleSearch = handleSearch;
    window.addToCart = addToCart;
    window.removeFromCart = removeFromCart;
    window.toggleCartModal = toggleCartModal;
    window.tp= totalPrice;
  //  window.placeOrder = placeOrder;

    // Initial load
    renderCatalog();
    updateCartUI();

  
  </script>
</body>
</html>
