<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DesiBites</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-red-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-orange-100">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-orange-600 to-amber-600 p-6 text-center text-white relative">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
            <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-md rounded-full mb-3 text-white hover:bg-white/30 transition">
                <i class="fa-solid fa-utensils text-xl"></i>
            </a>
            <h1 id="headerTitle" class="text-2xl font-bold tracking-wide">Join DesiBites 🍛</h1>
            <p id="headerSubtitle" class="text-orange-100 text-sm mt-1">Order authentic Indian flavors right to your door</p>
        </div>

        <!-- Signup Form Container -->
        <div class="p-8">
            <form id="signupForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
                
                <!-- STEP 1: Details Input Fields -->
                <div id="stepDetails" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" id="fullName" 
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                placeholder="Rahul Sharma">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="email" 
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                placeholder="rahul@example.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-regular fa-lock"></i>
                            </span>
                            <input type="password" id="password" 
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center pt-1">
                        <input type="checkbox" id="terms" 
                            class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
                        <label for="terms" class="ml-2 text-xs text-gray-600">
                            I agree to the <a href="#" class="text-orange-600 hover:underline font-medium">Terms of Service</a> & <a href="#" class="text-orange-600 hover:underline font-medium">Privacy Policy</a>
                        </label>
                    </div>
                </div>

                <!-- STEP 2: OTP Verification Fields (Initially Hidden) -->
                <div id="stepOtp" class="space-y-4 hidden">
                    <div class="text-center mb-2">
                        <p class="text-xs text-gray-500">We've sent a 6-digit verification code to</p>
                        <p id="displayEmail" class="text-sm font-semibold text-orange-600"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1 text-center">Enter Verification Code</label>
                        <input type="text" id="otpInput" maxlength="6" 
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-center text-2xl font-bold tracking-widest text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                            placeholder="123456">
                    </div>

                    <div class="text-center">
                        <button type="button" onclick="resendOtp()" class="text-xs text-orange-600 font-medium hover:underline">
                            Didn't receive code? Resend OTP
                        </button>
                    </div>
                </div>

                <!-- Submit / Action Button -->
                <button type="submit" id="submitBtn"
                    class="w-full mt-2 py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-700 hover:to-amber-700 text-white font-semibold rounded-xl shadow-lg shadow-orange-500/30 transition transform active:scale-95">
                    Get OTP
                </button>
            </form>

            <!-- Bottom Section (Hidden during OTP entry for clean layout) -->
            <div id="bottomSection">
                <!-- Divider -->
                <div class="relative flex py-4 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

               

                <!-- Login Redirect Link -->
                <p class="text-center text-sm text-gray-600 mt-3">
                    Already have an account? 
                    <a href="login.html" class="text-orange-600 font-semibold hover:underline">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Script to handle dynamic OTP toggle flow -->
    <script>
        let isOtpStep = false;
        let generatedMockOtp = ""; // In a real backend, this is handled on the server
        let info;

       async function handleFormSubmit(event) {
            event.preventDefault(); // Stop default form submit behavior

            if (!isOtpStep) {
                // STEP 1 VALIDATION & SWITCH TO OTP
                const name = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const terms = document.getElementById('terms').checked;

                if (!name || !email || !password) {
                    alert("Please fill in all fields.");
                    return;
                }
                if (!terms) {
                    alert("You must agree to the Terms and Conditions.");
                    return;
                }

                // Generate a mock 6-digit OTP (For testing convenience, alert it or log it)
                generatedMockOtp = Math.floor(100000 + Math.random() * 900000).toString();
                console.log("Mock OTP generated:", generatedMockOtp); 
                
                let obj= {
                  email: email,
                  otp:generatedMockOtp
                };

                 info={
                    email: email,
                    name: name,
                    password:password
                }
             
               
                let data= await fetch('/api/sendOtp' , {
                    method:'POST',
                    headers: {'content-type': 'application/json'},
                    body: JSON.stringify(obj)
                })

                let response =await data.text();
                //console.log(response)

                


                // Switch UI views
                document.getElementById('stepDetails').classList.add('hidden');
                document.getElementById('stepOtp').classList.remove('hidden');
                document.getElementById('displayEmail').innerText = email;
                
                // Update headers & button text
                document.getElementById('headerTitle').innerText = "Verify Your Email 🔒";
                document.getElementById('headerSubtitle').innerText = "Enter the code sent to your inbox";
                document.getElementById('submitBtn').innerText = "Verify & Register";
                document.getElementById('bottomSection').classList.add('hidden');

                isOtpStep = true;
            } else {
                // STEP 2 OTP VERIFICATION
                const enteredOtp = document.getElementById('otpInput').value;

                if (enteredOtp.length !== 6) {
                    alert("Please enter a valid 6-digit OTP.");
                    return;
                }

                if (enteredOtp === generatedMockOtp) {
                    alert("🎉 Verification successful! Welcome to DesiBites.");
                     
                    let data= await fetch('/api/addUserData',{
                        method:'POST',
                        headers:{'content-type': 'application/json'},
                        body: JSON.stringify(info)
                    });

                    let response= await data.json();

          console.log(response)
            //     alert(response.info)
                  localStorage.setItem('username',response.info.name);
                    localStorage.setItem('userId', response.id);
            
                   
                    window.location.href = 'items.html'; // Redirect to home/dashboard
                } else {
                    alert("❌ Incorrect OTP. Please try again.");
                }
            }
        } 

        function resendOtp() {
            generatedMockOtp = Math.floor(100000 + Math.random() * 900000).toString();
            console.log("New Mock OTP generated:", generatedMockOtp);
            alert(`[Dev Mode] New OTP sent! Code is: ${generatedMockOtp}`);
        }
    </script>
</body>
</html>
