<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DesiBites</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-red-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-orange-100">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-orange-600 to-amber-600 p-6 text-center text-white relative">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
            <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 bg-white/25 backdrop-blur-md rounded-full mb-3 text-white hover:bg-white/30 transition">
                <i class="fa-solid fa-utensils text-xl"></i>
            </a>
            <h1 class="text-2xl font-bold tracking-wide">Welcome Back! 👋</h1>
            <p class="text-orange-100 text-sm mt-1">Log in to track your spicy orders</p>
        </div>

        <!-- Login Form Container -->
        <div class="p-8">
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                
                <!-- Email Address -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="loginEmail" required 
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                            placeholder="rahul@example.com">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-orange-600 hover:underline font-medium">Forgot?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-regular fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" required 
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="remember" 
                        class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
                    <label for="remember" class="ml-2 text-xs text-gray-600">
                        Remember me for 30 days
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
        id="loginBtn"
        class="w-full mt-2 py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-700 hover:to-amber-700 text-white font-semibold rounded-xl shadow-lg shadow-orange-500/30 transition transform active:scale-95 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
    
    <!-- Spinner SVG (hidden by default) -->
    <svg id="loginSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    
    <!-- Button Text -->
    <span id="btnText">Log In</span>
</button>
            </form>

          

            <!-- Sign Up Redirect Link -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account? 
                <a href="signup.html" class="text-orange-600 font-semibold hover:underline">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Script to handle login simulation -->
    <script>
     async function handleLogin(event) {
    event.preventDefault(); // Stop default form submit behavior
    
    // 1. Get button and spinner elements (Make sure to add these IDs to your HTML button!)
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginSpinner');
    const btnText = document.getElementById('btnText');

    // 2. Turn on loading state
    if (btn) btn.disabled = true;
    if (spinner) spinner.classList.remove('hidden');
    if (btnText) btnText.innerText = "Logging in...";

    try {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const obj = {
            email: email,
            password: password
        }; 

        let data = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(obj)
        });

        let response = await data.json();
      //  console.log(response);
        
        if (response.success == true) {
            alert(`Welcome back, ${response.name}! You have successfully logged into DesiBites`);
            localStorage.setItem('username', response.name);
            localStorage.setItem('userId', response.id);
             

             let addData=await fetch('/api/fetchAddress', {
                        method: 'POST',
                        headers:{'content-type':'application/json'},
                        body: response.id
                    })

                    let info=await addData.json();
                    let currentAdd={
                        address:'',
                         phone: '',
                         city: '',
                         id: ''
                    };
                    
                    if(info.address !=null){
                        currentAdd.address= info.address;
                        currentAdd.phone= info.phoneNumber;
                        currentAdd.city= info.city;
                        currentAdd.id = Number(info.id);

                        localStorage.setItem('address',JSON.stringify(currentAdd))
                    }

                    else{
                        localStorage.setItem('address', '');
                    }

                   // console.log(info)

           window.location.href = 'items.html';
        } else {
            // Handle incorrect login case (turn off loading so they can try again)
            alert(response.text || "Login failed");
            resetLoadingState();
        }

    } catch (error) {
        console.error("Network or server error:", error);
        alert("An error occurred. Please try again.");
        resetLoadingState();
    }

    // Helper function to turn off the loader if login fails
    function resetLoadingState() {
        if (btn) btn.disabled = false;
        if (spinner) spinner.classList.add('hidden');
        if (btnText) btnText.innerText = "Log In";
    }
}
    </script>
</body>
</html>
