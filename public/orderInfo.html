<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiBites & Eats - Order & User Info</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-gray-800">User & Order Details</h1>
            <a href="dashboard.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                &larr; Back to Dashboard
            </a>
        </div>

        <!-- User Information Card -->
        <div class="bg-white shadow-md rounded-xl p-6 mb-8 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">User Profile</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-gray-600">
                <p><strong>Name:</strong> <span id="profile-name" class="text-gray-900 font-medium">Loading...</span></p>
                <p><strong>Email:</strong> <span id="profile-email" class="text-gray-900 font-medium">Loading...</span></p>
                <p class="md:col-span-2"><strong>Address:</strong> <span id="profile-address" class="text-gray-900 font-medium">Loading...</span></p>
                <p class="md:col-span-2"><strong>Phone Number: </strong> <span id="profile-number" class="text-gray-900 font-medium">Loading...</span></p>
            </div>
        </div>

        <!-- Products Section -->
        <div class="bg-white shadow-md rounded-xl p-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">Associated Products</h2>
            
            <!-- Product Container where cards will be injected -->
            <div id="product-list-container" class="space-y-4">
                <p class="text-gray-500 italic">Loading products...</p>
            </div>
        </div>
    </div>

    <!-- Frontend Script to Fetch and Render Data -->
    <script>
        async function loadFullUserData() {
            // Grab user ID from URL parameters (e.g., order-info.html?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            let orderId = urlParams.get('id');

            if (!orderId) {
                document.getElementById('product-list-container.html').innerHTML = '<p class="text-red-500">No user ID specified.</p>';
                return;
            }

            try {
                let response = await fetch(`/api/ordersList/${orderId}`);
                let result = await response.json();

                if (result.success) {
                    let user = result.data;
                    let products= JSON.parse(result.products);
                 // 1. Display User Info
                    document.getElementById('profile-name').innerText = user.name || 'N/A';
                    document.getElementById('profile-email').innerText = user.email || 'N/A';
                    document.getElementById('profile-address').innerText = user.address || 'N/A';
                    document.getElementById('profile-number').innerText = '+91 ' + user.phoneNumber || 'N/A';

                    // 2. Display Products & their parsed descriptions
                    let productContainer = document.getElementById('product-list-container');
                    productContainer.innerHTML = '';

                    if (!products || products.length === 0) {
                        productContainer.innerHTML = '<p class="text-gray-500">No products found for this user.</p>';
                        return;
                    }

                    products.forEach(prod => {
                        let card = document.createElement('div');
                        card.className = 'border border-gray-200 rounded-lg p-4 bg-gray-50 shadow-sm';
                        
                    // Handle description formatting (if it became an object via JSON.parse)
                        let formattedDesc = typeof prod.description === 'object' 
                            ? JSON.stringify(prod.description, null, 2) 
                            : prod.description;

                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold text-gray-800">${prod.name}</h3>
                                <span class="bg-orange-100 text-orange-800 text-xs font-semibold px-2.5 py-0.5 rounded">${prod.category || 'General'}</span>
                            </div>
                            <p class="text-gray-600 mb-2"><strong>Price:</strong> ₹${prod.price}</p>
                            <div class="mt-2">
                                <strong class="text-xs uppercase tracking-wider text-gray-500">Description: </strong>
                               <strong class="text-xs uppercase tracking-wider text-gray-500">${formattedDesc}</strong>
                            </div>
                        `;
                        productContainer.appendChild(card);
                    });
                } else {
                    document.getElementById('product-list-container').innerHTML = `<p class="text-red-500">${result.message}</p>`;
                }
            } catch (err) {
                console.error("Failed to fetch user data:", err);
                document.getElementById('product-list-container').innerHTML = '<p class="text-red-500">Error connecting to the server.</p>';
            }
        }

        // Run on page load
        loadFullUserData();
    </script>
</body>
</html>
