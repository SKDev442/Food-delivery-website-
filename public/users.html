<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users Dashboard - DesiBites & Eats</title>
    <!-- Tailwind CSS CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-3 sm:p-6 md:p-8">

    <div class="w-full max-w-6xl mx-auto bg-white shadow-md rounded-2xl p-4 sm:p-6">
        
        <!-- Header & Back Button -->
        <div class="flex items-center justify-between gap-4 mb-4 sm:mb-6">
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800">
                Registered Users Data
            </h1>
            <a href="/dashboard.html" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-sm">
                ← Dashboard
            </a>
        </div>

        <!-- Scrollable Table Wrapper -->
        <div class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
            <table class="w-full text-left border-collapse min-w-[650px]">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 uppercase text-xs sm:text-sm tracking-wider">
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">ID</th>
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">Name</th>
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">Email</th>
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">Phone</th>
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">City</th>
                        <th class="p-2.5 sm:p-3 border-b border-gray-200">Address</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="text-gray-600 text-xs sm:text-sm divide-y divide-gray-100">
                    <tr>
                        <td colspan="6" class="p-6 text-center text-gray-500">Loading orders from database...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
    <script>
        // Fetch all users from backend when the page loads
        async function fetchUsers() {
            try {
                let response = await fetch('/api/users');
                let result = await response.json();

                    let tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = ''; // Clear any existing rows

                    result.forEach(user => {
                        let row = `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3 border">${user.id}</td>
                                <td class="p-3 border">${user.name || '-'}</td>
                                <td class="p-3 border">${user.email || '-'}</td>
                                <td class="p-3 border">${user.phoneNumber || '-'}</td>
                                <td class="p-3 border">${user.city || '-'}</td>
                                <td class="p-3 border">${user.address || '-'}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                
            } catch (error) {
                console.error('Error fetching users:', error);
               // alert('Network error while loading users.');
            }
        }

        // Run function on page load
        window.onload = fetchUsers;
    </script>

</body>
</html>
